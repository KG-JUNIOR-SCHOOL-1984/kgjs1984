<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Result Entry | School Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#eef3f8;
}

.card{
border:none;
border-radius:18px;
}

.card-header{
border-radius:18px 18px 0 0!important;
}

.section-title{
font-size:18px;
font-weight:bold;
color:#198754;
border-bottom:2px solid #198754;
padding-bottom:6px;
margin:25px 0 20px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-success shadow">

<div class="container">

<a class="navbar-brand fw-bold"
href="dashboard.html">

📊 Result Entry

</a>

<div>

<a href="result_list.html"
class="btn btn-warning btn-sm">

📋 Result List

</a>

<a href="dashboard.html"
class="btn btn-light btn-sm">

🏠 Dashboard

</a>

</div>

</div>

</nav>

<div class="container py-4">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3 class="mb-1">

📝 Student Result Entry

</h3>

<p class="mb-0">

Add / Update Student Examination Result

</p>

</div>

<div class="card-body">

<form id="resultForm">

<div class="section-title">

Exam Information

</div>

<div class="row">

<div class="col-md-4 mb-3">

<label class="form-label">

Session

</label>

<select
id="session"
class="form-select"
required>

<option value="">Select Session</option>

<option>2026</option>
<option>2027</option>
<option>2028</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Exam

</label>

<select
id="examName"
class="form-select"
required>

<option value="">Select Exam</option>

<option>1st Term</option>

<option>2nd Term</option>

<option>3rd Term</option>

<option>Annual Exam</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Class

</label>

<select
id="studentClass"
class="form-select"
required>

<option value="">Select Class</option>

<option>Play</option>
<option>Nursery</option>
<option>KG</option>
<option>Class 1</option>
<option>Class 2</option>
<option>Class 3</option>
<option>Class 4</option>
<option>Class 5</option>

</select>

</div>
<div class="section-title">

Student Information

</div>

<div class="row">

<div class="col-md-4 mb-3">

<label class="form-label">

Student ID

</label>

<select
id="studentId"
class="form-select"
required>

<option value="">

Select Student

</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Student Name

</label>

<input
type="text"
id="studentName"
class="form-control"
readonly>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Roll Number

</label>

<input
type="text"
id="studentRoll"
class="form-control"
readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Subject

</label>

<select
id="subjectName"
class="form-select"
required>

<option value="">Select Subject</option>

<option>Bangla</option>

<option>English</option>

<option>Mathematics</option>

<option>General Knowledge</option>

<option>Religion</option>

<option>Bangladesh & Global Studies</option>

<option>Science</option>

<option>Introduction to Environment</option>

<option>Active English</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Teacher Remark

</label>

<input
type="text"
id="teacherRemark"
class="form-control"
placeholder="Excellent / Good / Average">

</div>

</div>
<div class="section-title">

Marks Information

</div>

<div class="row">

<div class="col-md-4 mb-3">

<label class="form-label">

Full Marks

</label>

<input
type="number"
id="fullMarks"
class="form-control"
value="100"
readonly>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Pass Marks

</label>

<input
type="number"
id="passMarks"
class="form-control"
value="33"
readonly>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Obtained Marks

</label>

<input
type="number"
id="obtainedMarks"
class="form-control"
min="0"
max="100"
required>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Grade

</label>

<input
type="text"
id="grade"
class="form-control"
readonly>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

GPA

</label>

<input
type="text"
id="gpa"
class="form-control"
readonly>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Result Status

</label>

<input
type="text"
id="resultStatus"
class="form-control"
readonly>

</div>

</div>
<hr>

<div class="text-center">

<button
type="submit"
class="btn btn-success btn-lg">

💾 Save Result

</button>

<button
type="reset"
class="btn btn-warning btn-lg">

🔄 Reset

</button>

<a
href="result_list.html"
class="btn btn-primary btn-lg">

📋 Result List

</a>

<a
href="dashboard.html"
class="btn btn-secondary btn-lg">

🏠 Dashboard

</a>

</div>

</form>

</div>

</div>

</div>

<footer class="text-center py-3 mt-4">

<small>

© 2026 Gobindaganj KG & Junior School<br>

School Management System V7

</small>

</footer>

<script type="module" src="js/result_entry.js"></script>

</body>

</html>
