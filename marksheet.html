<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Student Marksheet | School Management System

</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="css/style.css">

<style>

body{

background:#eef3f8;

}

.card{

border:none;

border-radius:18px;

}

.card-header{

border-radius:18px 18px 0 0!important;

}

.school-title{

font-size:26px;

font-weight:bold;

color:#198754;

}

.school-sub{

font-size:15px;

color:#555;

}

.section-title{

font-size:18px;

font-weight:bold;

color:#198754;

border-bottom:2px solid #198754;

padding-bottom:6px;

margin:20px 0;

}

@media print{

.no-print{

display:none;

}

body{

background:#fff;

}

}

</style>

</head>

<body>

<div class="container py-4">

<div class="card shadow">

<div class="card-body">

<div class="text-center">

<h2 class="school-title">

Gobindaganj KG & Junior School

</h2>

<p class="school-sub">

Gobindaganj, Gaibandha

</p>

<h4>

Academic Marksheet

</h4>

</div>

<hr>

<div class="row no-print">

<div class="col-md-4 mb-3">

<label class="form-label">

Session

</label>

<select
id="session"
class="form-select">

<option value="">Select Session</option>

<option>2026</option>

<option>2027</option>

<option>2028</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Exam

</label>

<select
id="examFilter"
class="form-select"
disabled>

<option value="">Select Exam</option>

<option>1st Term</option>

<option>2nd Term</option>

<option>3rd Term</option>

<option>Annual Exam</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Student

</label>

<select
id="studentFilter"
class="form-select"
disabled>

<option value="">

Select Student

</option>

</select>

</div>

</div>
<div class="section-title">

Student Information

</div>

<div class="row">

<div class="col-md-4 mb-3">

<label class="form-label">

Student Name

</label>

<input
type="text"
id="studentName"
class="form-control"
readonly>

</div>

<div class="col-md-2 mb-3">

<label class="form-label">

Roll

</label>

<input
type="text"
id="studentRoll"
class="form-control"
readonly>

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Class

</label>

<input
type="text"
id="studentClass"
class="form-control"
readonly>

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Student ID

</label>

<input
type="text"
id="studentId"
class="form-control"
readonly>

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Exam

</label>

<input
type="text"
id="examName"
class="form-control"
readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Result Date

</label>

<input
type="text"
id="resultDate"
class="form-control"
readonly>

</div>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Father's Name

</label>

<input
type="text"
id="fatherName"
class="form-control"
readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Mother's Name

</label>

<input
type="text"
id="motherName"
class="form-control"
readonly>

</div>

</div>

<div class="section-title">

Subject Wise Result

</div>

<div class="table-responsive">

<table class="table table-bordered">

<thead class="table-success">

<tr>

<th>SL</th>

<th>Subject</th>

<th>Obtained Marks</th>

</tr>

</thead>

<tbody id="marksheetTableBody">

<tr>
<td>1</td>
<td>Bangla</td>
<td id="bangla">0</td>
</tr>

<tr>
<td>2</td>
<td>English</td>
<td id="english">0</td>
</tr>

<tr>
<td>3</td>
<td>Mathematics</td>
<td id="math">0</td>
</tr>

<tr>
<td>4</td>
<td>Science</td>
<td id="science">0</td>
</tr>

<tr>
<td>5</td>
<td>Bangladesh & Global Studies</td>
<td id="bgs">0</td>
</tr>

<tr>
<td>6</td>
<td>Religion</td>
<td id="religion">0</td>
</tr>

<tr>
<td>7</td>
<td>ICT</td>
<td id="ict">0</td>
</tr>

</tbody>

</table>

</div>

<div class="section-title">

Result Summary

</div>

<div class="row">

<div class="col-md-3 mb-3">

<label class="form-label">Total Marks</label>

<input type="text" id="total" class="form-control" readonly>

</div>

<div class="col-md-3 mb-3">

<label class="form-label">GPA</label>

<input type="text" id="gpa" class="form-control" readonly>

</div>

<div class="col-md-3 mb-3">

<label class="form-label">Grade</label>

<input type="text" id="grade" class="form-control" readonly>

</div>

<div class="col-md-3 mb-3">

<label class="form-label">Result</label>

<input type="text" id="resultStatus" class="form-control" readonly>

</div>

</div>

<div class="text-center no-print mt-3">

<button class="btn btn-success" onclick="printMarksheet()">

🖨 Print Marksheet

</button>

</div>

</div>

</div>

</div>

<script type="module" src="js/marksheet.js"></script>

</body>

</html>
