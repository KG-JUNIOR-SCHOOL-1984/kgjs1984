<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher List | School Management System V6</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

body{
    background:#f4f7fb;
}

.card{
    border:none;
    border-radius:18px;
}

.card-header{
    border-radius:18px 18px 0 0!important;
}

.table img{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

<div class="container">

<a class="navbar-brand fw-bold"
href="dashboard.html">

🏫 Gobindaganj KG & Junior School

</a>

<div>

<a href="dashboard.html"
class="btn btn-light btn-sm">

🏠 Dashboard

</a>

<a href="teachers.html"
class="btn btn-warning btn-sm">

➕ Add Teacher

</a>

</div>

</div>

</nav>

<div class="container py-4">

<div class="card shadow-lg">

<div class="card-header bg-primary text-white">

<h3 class="mb-0">👨‍🏫 Teacher List</h3>

</div>

<div class="card-body">

<div class="row mb-3">

<div class="col-md-6">

<input
type="text"
id="searchTeacher"
class="form-control"
placeholder="🔍 Search Teacher..."
onkeyup="searchTeacher()">

</div>

<div class="col-md-6 text-end">

<h5>

Total Teachers :
<span id="teacherCount">0</span>

</h5>

</div>

</div>
<div class="table-responsive">

<table class="table table-bordered table-hover align-middle">

<thead class="table-dark">

<tr>

<th>#</th>

<th>Photo</th>

<th>Teacher ID</th>

<th>Name</th>

<th>Designation</th>

<th>Subject</th>

<th>Mobile</th>

<th>Status</th>

<th width="280">Action</th>

</tr>

</thead>

<tbody id="teacherTableBody">

<!-- teachers.js automatically loads data here -->

</tbody>

</table>

</div>
</div>

</div>

</div>

<footer class="text-center py-3">

<small>

© 2026 Gobindaganj KG & Junior School

</small>

</footer>

<script type="module" src="js/teachers.js"></script>

</body>

</html>
