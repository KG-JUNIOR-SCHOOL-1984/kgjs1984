<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student ID Card</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f2f5fa;
}

.id-card{

    width:360px;

    margin:30px auto;

    background:#ffffff;

    border-radius:20px;

    border:3px solid #0d6efd;

    overflow:hidden;

    box-shadow:0 5px 20px rgba(0,0,0,.2);

}

.header{

    background:#0d6efd;

    color:#fff;

    text-align:center;

    padding:15px;

}

.logo{

    width:70px;

    height:70px;

    border-radius:50%;

    background:#fff;

    object-fit:cover;

}

.photo{

    width:120px;

    height:120px;

    border-radius:50%;

    border:4px solid #0d6efd;

    object-fit:cover;

}

.info{

    padding:20px;

}

.info p{

    margin:6px 0;

    font-size:15px;

}

.footer{

    background:#0d6efd;

    color:#fff;

    text-align:center;

    padding:10px;

}

</style>

</head>

<body>

<div class="id-card">

<div class="header">

<img
src="images/logo.png"
class="logo">

<h4 class="mt-2">

Gobindaganj KG & Junior School

</h4>

<small>

STUDENT ID CARD

</small>

</div>

<div class="text-center mt-3">

<img
id="cardPhoto"
class="photo"
src="https://via.placeholder.com/120">

</div>

<div class="info">
    <p><strong>Student ID :</strong>
<span id="cardStudentId"></span></p>

<p><strong>Name :</strong>
<span id="cardName"></span></p>

<p><strong>Father :</strong>
<span id="cardFather"></span></p>

<p><strong>Mother :</strong>
<span id="cardMother"></span></p>

<p><strong>Class :</strong>
<span id="cardClass"></span></p>

<p><strong>Roll :</strong>
<span id="cardRoll"></span></p>

<p><strong>Section :</strong>
<span id="cardSection"></span></p>

<p><strong>Session :</strong>
<span id="cardSession"></span></p>

<p><strong>Blood Group :</strong>
<span id="cardBlood"></span></p>

<p><strong>Guardian Mobile :</strong>
<span id="cardGuardianMobile"></span></p>

<p><strong>Status :</strong>
<span id="cardStatus"></span></p>

<div class="text-center mt-4">

<button
class="btn btn-primary"
onclick="window.print()">

🖨 Print ID Card

</button>

<a
href="students_list.html"
class="btn btn-secondary">

← Back

</a>

</div>
</div>

<div class="footer">

<strong>Gobindaganj KG & Junior School</strong>

<br>

<small>
This card is the property of the school.
If found, please return to the school office.
</small>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="js/students_incard.js"></script>

</body>
</html>
