<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Salary List</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f7fb;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.table th{
background:#198754;
color:#fff;
white-space:nowrap;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-success">

<div class="container">

<a class="navbar-brand fw-bold">

💰 Salary List

</a>

<div>

<a href="salary.html"
class="btn btn-warning btn-sm">

➕ Add Salary

</a>

<a href="dashboard.html"
class="btn btn-light btn-sm">

🏠 Dashboard

</a>

</div>

</div>

</nav>

<div class="container py-4">

<div class="card">

<div class="card-header bg-success text-white">

<h5 class="mb-0">

Teacher Salary Records

</h5>

</div>

<div class="card-body">

<div class="row mb-3">

<div class="col-md-5">

<input
type="text"
id="searchSalary"
class="form-control"
placeholder="Search Teacher ID / Name..."
onkeyup="searchSalary()">

</div>

<div class="col-md-3">

<input
type="month"
id="monthFilter"
class="form-control"
onchange="searchSalary()">

</div>

<div class="col-md-2">

<select
id="statusFilter"
class="form-select"
onchange="searchSalary()">

<option value="">All Status</option>

<option>Paid</option>

<option>Pending</option>

</select>

</div>

<div class="col-md-2">

<button
class="btn btn-success w-100"
onclick="searchSalary()">

🔍 Search

</button>

</div>

</div>
<div class="table-responsive">

<table class="table table-bordered table-hover align-middle text-center">

<thead>

<tr>

<th>SL</th>

<th>Teacher ID</th>

<th>Teacher Name</th>

<th>Month</th>

<th>Basic Salary</th>

<th>Bonus</th>

<th>Deduction</th>

<th>Net Salary</th>

<th>Payment Date</th>

<th>Status</th>

<th width="220">Action</th>

</tr>

</thead>

<tbody id="salaryTableBody">

<!-- Salary Records -->

</tbody>

</table>

</div>

<div class="row mt-3">

<div class="col-md-6">

<h6>

Total Records :
<span id="totalSalary">0</span>

</h6>

<h6 class="mt-2">

Total Paid :
<span id="totalPaid">৳ 0</span>

</h6>

</div>

<div class="col-md-6 text-end">

<button
class="btn btn-success"
onclick="window.print()">

🖨 Print

</button>

</div>

</div>
</div>

</div>

</div>

<footer class="text-center py-3 mt-4">

<small>

© 2026 Gobindaganj KG & Junior School

</small>

</footer>

<script type="module" src="js/salary_list.js"></script>

</body>

</html>
