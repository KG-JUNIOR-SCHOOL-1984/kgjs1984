name: Build KGJS Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare KGJS Logo
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp assets/kgjs_logo_square_512.png \
            app/src/main/res/drawable/kgjs_logo.png

          cp assets/kgjs_logo_square_512.png \
            app/src/main/res/mipmap-mdpi/ic_launcher.png

          cp assets/kgjs_logo_square_512.png \
            app/src/main/res/mipmap-hdpi/ic_launcher.png

          cp assets/kgjs_logo_square_512.png \
            app/src/main/res/mipmap-xhdpi/ic_launcher.png

          cp assets/kgjs_logo_square_512.png \
            app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cp assets/kgjs_logo_square_512.png \
            app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Create Android project
        shell: bash
        run: |

          mkdir -p app/src/main/java/com/kgjs/school
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KGJS"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.6.1" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.kgjs.school"
              compileSdk 35

              defaultConfig {
                  applicationId "com.kgjs.school"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="KG &amp; Junior School"
                  android:icon="@mipmap/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
              </style>

          </resources>
          EOF

                    cat > app/src/main/java/com/kgjs/school/MainActivity.java <<'EOF'
package com.kgjs.school;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.CookieManager;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;

public class MainActivity extends Activity {

    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        webView = new WebView(this);

        WebSettings settings = webView.getSettings();

        // JavaScript
        settings.setJavaScriptEnabled(true);

        // Firebase / Web App storage
        settings.setDomStorageEnabled(true);
        settings.setDatabaseEnabled(true);

        // Web content
        settings.setAllowFileAccess(true);
        settings.setAllowContentAccess(true);

        // Cookies - important for Firebase Auth
        CookieManager cookieManager =
                CookieManager.getInstance();

        cookieManager.setAcceptCookie(true);
        cookieManager.setAcceptThirdPartyCookies(
                webView, true
        );

        // Required for JavaScript alert(), confirm(), etc.
        webView.setWebChromeClient(new WebChromeClient());

        // Keep navigation inside the app
        webView.setWebViewClient(new WebViewClient());

        // Your KGJS website
        webView.loadUrl(
            "https://kg-junior-school-1984.github.io/kgjs1984/"
        );

        setContentView(webView);
    }

    @Override
    public void onBackPressed() {
        if (webView.canGoBack()) {
            webView.goBack();
        } else {
            super.onBackPressed();
        }
    }
}
EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KGJS-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
