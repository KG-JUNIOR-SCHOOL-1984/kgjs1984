<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#eef3f8;
}

.profile-card{
    max-width:900px;
    margin:30px auto;
    background:#fff;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    overflow:hidden;
}

.profile-header{
    background:#0d6efd;
    color:#fff;
    text-align:center;
    padding:25px;
}

.profile-photo{

    width:170px;
    height:170px;
    border-radius:50%;
    border:5px solid #fff;
    object-fit:cover;
    background:#fff;

}

.table th{

    width:35%;
    background:#f8f9fa;

}

</style>

</head>

<body>

<div class="container">

<div class="profile-card">

<div class="profile-header">

<img
id="profilePhoto"
src="https://via.placeholder.com/170"
class="profile-photo">

<h3
class="mt-3"
id="profileName">

Teacher Name

</h3>

<p
id="profileID">

Teacher ID

</p>

</div>

<div class="card-body p-4">

<table class="table table-bordered">

<tbody>
   <tr>
    <th>Teacher ID</th>
    <td id="pTeacherId"></td>
</tr>

<tr>
    <th>Teacher Name</th>
    <td id="pTeacherName"></td>
</tr>

<tr>
    <th>Father's Name</th>
    <td id="pFather"></td>
</tr>

<tr>
    <th>Mother's Name</th>
    <td id="pMother"></td>
</tr>

<tr>
    <th>Designation</th>
    <td id="pDesignation"></td>
</tr>

<tr>
    <th>Subject</th>
    <td id="pSubject"></td>
</tr>

<tr>
    <th>Joining Date</th>
    <td id="pJoiningDate"></td>
</tr>

<tr>
    <th>Date of Birth</th>
    <td id="pDOB"></td>
</tr>

<tr>
    <th>Gender</th>
    <td id="pGender"></td>
</tr>

<tr>
    <th>Religion</th>
    <td id="pReligion"></td>
</tr>

<tr>
    <th>Mobile</th>
    <td id="pMobile"></td>
</tr>

<tr>
    <th>Email</th>
    <td id="pEmail"></td>
</tr>

<tr>
    <th>Monthly Salary</th>
    <td id="pSalary"></td>
</tr>

<tr>
    <th>Status</th>
    <td id="pStatus"></td>
</tr>

<tr>
    <th>Address</th>
    <td id="pAddress"></td>
</tr>
</tbody>

</table>

<div class="mt-4 d-flex flex-wrap gap-2">

<button
class="btn btn-primary"
onclick="window.print()">

🖨 Print Profile

</button>

<a
href="teachers_list.html"
class="btn btn-success">

📋 Teacher List

</a>

<a
href="dashboard.html"
class="btn btn-secondary">

🏠 Dashboard

</a>

</div>

</div>

</div>

</div>

</div>

<footer class="text-center py-3 mt-4">

<small>

© 2026 Gobindaganj KG & Junior School

</small>

</footer>

<script type="module" src="js/teachers_profile.js"></script>

</body>

</html>
