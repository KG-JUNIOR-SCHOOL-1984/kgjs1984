<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student List | Gobindaganj KG & Junior School</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#eef3f8;
}

.card{
    border:none;
    border-radius:18px;
}

.card-header{
    border-radius:18px 18px 0 0!important;
}

.table img{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand fw-bold"
href="dashboard.html">

🏫 Gobindaganj KG & Junior School

</a>

<a href="students.html"
class="btn btn-warning">

➕ Add Student

</a>

</div>

</nav>

<div class="container py-4">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>📋 Student List</h3>

<p class="mb-0">

All Students Information

</p>

</div>

<div class="card-body">
    <div class="row mb-3">

    <div class="col-md-5 mb-2">

        <input
            type="text"
            id="searchStudent"
            class="form-control"
            placeholder="🔍 Search by Name / ID / Mobile"
            onkeyup="searchStudent()">

    </div>

    <div class="col-md-3 mb-2">

        <select
            id="classFilter"
            class="form-select"
            onchange="searchStudent()">

            <option value="">All Classes</option>

            <option>Play</option>
            <option>Nursery</option>
            <option>KG</option>
            <option>Class 1</option>
            <option>Class 2</option>
            <option>Class 3</option>
            <option>Class 4</option>
            <option>Class 5</option>
            <option>Class 6</option>
            <option>Class 7</option>
            <option>Class 8</option>

        </select>

    </div>

    <div class="col-md-2 mb-2">

        <button
            class="btn btn-success w-100"
            onclick="refreshStudentTable()">

            🔄 Refresh

        </button>

    </div>

    <div class="col-md-2 mb-2 text-end">

        <h5 class="mt-2">

            Total :
            <span
                class="badge bg-primary"
                id="studentCount">

                0

            </span>

        </h5>

    </div>

    </div>
    <div class="table-responsive">

<table class="table table-bordered table-hover align-middle">

<thead class="table-dark">

<tr>

<th>#</th>

<th>Photo</th>

<th>Student ID</th>

<th>Name</th>

<th>Class</th>

<th>Roll</th>

<th>Mobile</th>

<th>Status</th>

<th width="260">Action</th>

</tr>

</thead>

<tbody id="studentTableBody">

<tr>

<td colspan="9" class="text-center text-muted">

Loading Students...

</td>

</tr>

</tbody>

</table>

    </div>
    <hr>

<div class="d-flex flex-wrap justify-content-center gap-2 mt-3">

<a
href="students.html"
class="btn btn-primary">

➕ Add Student

</a>

<button
class="btn btn-success"
onclick="window.print()">

🖨 Print List

</button>

<button
class="btn btn-warning"
onclick="refreshStudentTable()">

🔄 Refresh

</button>

<a
href="dashboard.html"
class="btn btn-secondary">

🏠 Dashboard

</a>

</div>

</div>

</div>

</div>

<footer class="text-center py-3 mt-4">

<small>

© 2026 Gobindaganj KG & Junior School

</small>

</footer>
<script type="module" src="js/students_list.js"></script>
<script type="module" src="js/studentAuth.js"></script>

</body>

</html>
