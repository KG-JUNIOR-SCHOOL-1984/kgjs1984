<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notice Board | School Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
<div class="container">
<a class="navbar-brand fw-bold" href="dashboard.html">🏫 School Management System</a>
<a href="dashboard.html" class="btn btn-light btn-sm">⬅ Dashboard</a>
</div>
</nav>

<div class="container py-4">

<h3 class="mb-4">📢 Notice Board</h3>

<div class="card shadow mb-4">
<div class="card-header bg-primary text-white">Publish a Notice</div>
<div class="card-body">

<form id="noticeForm" onsubmit="event.preventDefault(); saveNotice();">

<div class="row g-3">

<div class="col-md-8">
<label class="form-label">Title</label>
<input type="text" id="noticeTitle" class="form-control" placeholder="e.g. Annual Sports Day" required>
</div>

<div class="col-md-4">
<label class="form-label">Audience</label>
<select id="noticeAudience" class="form-select">
<option value="all">Everyone</option>
<option value="students">Students Only</option>
<option value="teachers">Teachers Only</option>
</select>
</div>

<div class="col-12">
<label class="form-label">Message</label>
<textarea id="noticeMessage" class="form-control" rows="4" placeholder="Notice details..." required></textarea>
</div>

</div>

<div class="mt-3">
<button type="submit" class="btn btn-primary">📢 Publish Notice</button>
</div>

</form>

</div>
</div>

<div class="card shadow">
<div class="card-header bg-primary text-white">All Notices</div>
<div class="card-body">

<div class="table-responsive">
<table class="table table-striped align-middle">
<thead>
<tr>
<th>Title</th>
<th>Message</th>
<th>Audience</th>
<th>Date</th>
<th>Action</th>
</tr>
</thead>
<tbody id="noticeTableBody"></tbody>
</table>
</div>

</div>
</div>

</div>

<footer class="bg-primary text-white text-center py-3 mt-4">
© School Management System 2026
</footer>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/notices.js"></script>

</body>
</html>
