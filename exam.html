<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Exam Setup</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f7fb;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.card-header{
font-weight:bold;
font-size:18px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand fw-bold">

📝 Exam Management

</a>

<div>

<a href="dashboard.html"
class="btn btn-light btn-sm">

🏠 Dashboard

</a>

<a href="exam_list.html"
class="btn btn-warning btn-sm">

📋 Exam List

</a>

</div>

</div>

</nav>

<div class="container py-4">

<div class="card">

<div class="card-header bg-primary text-white">

Exam Information

</div>

<div class="card-body">

<form id="examForm">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Exam Name

</label>

<select
id="examName"
class="form-select"
required>

<option value="">

Select Exam

</option>

<option>1st Term</option>

<option>2nd Term</option>

<option>3rd Term</option>

<option>Annual</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Academic Year

</label>

<input
type="number"
id="examYear"
class="form-control"
placeholder="2026"
required>

</div>
<div class="col-md-6 mb-3">

<label class="form-label">

Class

</label>

<select
id="examClass"
class="form-select"
required>

<option value="">Select Class</option>

<option>Play</option>
<option>Nursery</option>
<option>KG</option>

<option>Class 1</option>
<option>Class 2</option>
<option>Class 3</option>
<option>Class 4</option>
<option>Class 5</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Start Date

</label>

<input
type="date"
id="startDate"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

End Date

</label>

<input
type="date"
id="endDate"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Result Publish Date

</label>

<input
type="date"
id="resultDate"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Status

</label>

<select
id="examStatus"
class="form-select">

<option>Upcoming</option>

<option>Running</option>

<option>Completed</option>

</select>

</div>
<div class="col-12 mb-3">

<label class="form-label">

Exam Description

</label>

<textarea
id="examDescription"
class="form-control"
rows="3"
placeholder="Write Exam Description..."></textarea>

</div>

</div>

<hr>

<div class="d-flex flex-wrap gap-2">

<button
type="submit"
class="btn btn-primary">

💾 Save Exam

</button>

<button
type="reset"
class="btn btn-secondary">

🔄 Reset

</button>

<a
href="exam_list.html"
class="btn btn-success">

📋 Exam List

</a>

<a
href="dashboard.html"
class="btn btn-dark">

🏠 Dashboard

</a>

</div>

</form>

</div>

</div>

</div>

<footer class="text-center py-3 mt-4">

<small>

© 2026 Gobindaganj KG & Junior School

</small>

</footer>

<script type="module" src="js/exam.js"></script>

</body>

</html>
