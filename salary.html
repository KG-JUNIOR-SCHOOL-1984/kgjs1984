<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Salary Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f7fb;
}

.card{
border:none;
border-radius:15px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-success">

<div class="container">

<a class="navbar-brand">

💰 Salary Management

</a>

<a href="dashboard.html"
class="btn btn-light btn-sm">

🏠 Dashboard

</a>

</div>

</nav>

<div class="container py-4">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h4 class="mb-0">

Teacher Salary Entry

</h4>

</div>

<div class="card-body">

<form id="salaryForm">

<div class="row">

<div class="col-md-4 mb-3">

<label class="form-label">

Teacher ID

</label>

<input
type="text"
id="teacherId"
class="form-control"
placeholder="TCH-000001">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Teacher Name

</label>

<input
type="text"
id="teacherName"
class="form-control"
readonly>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Month

</label>

<input
type="month"
id="salaryMonth"
class="form-control"
required>

</div>
<div class="col-md-3 mb-3">

<label class="form-label">

Basic Salary

</label>

<input
type="number"
id="basicSalary"
class="form-control"
required>

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Bonus

</label>

<input
type="number"
id="bonus"
class="form-control"
value="0">

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Deduction

</label>

<input
type="number"
id="deduction"
class="form-control"
value="0">

</div>

<div class="col-md-3 mb-3">

<label class="form-label">

Net Salary

</label>

<input
type="number"
id="netSalary"
class="form-control"
readonly>

</div>

</div>

<div class="row">

<div class="col-md-4 mb-3">

<label class="form-label">

Payment Date

</label>

<input
type="date"
id="paymentDate"
class="form-control"
required>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Payment Method

</label>

<select
id="paymentMethod"
class="form-select">

<option>Cash</option>

<option>Bank</option>

<option>bKash</option>

<option>Nagad</option>

<option>Rocket</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Status

</label>

<select
id="salaryStatus"
class="form-select">

<option>Paid</option>

<option>Pending</option>

</select>

</div>

</div>
<div class="row">

<div class="col-md-12 mb-3">

<label class="form-label">

Remarks

</label>

<textarea
id="remarks"
class="form-control"
rows="3"
placeholder="Optional"></textarea>

</div>

</div>

<div class="d-flex flex-wrap gap-2 mt-3">

<button
type="submit"
class="btn btn-success">

💾 Save Salary

</button>

<button
type="reset"
class="btn btn-warning">

🔄 Reset

</button>

<a
href="salary_list.html"
class="btn btn-primary">

📋 Salary List

</a>

<a
href="dashboard.html"
class="btn btn-secondary">

🏠 Dashboard

</a>

</div>

</form>

</div>

</div>

</div>
</div>

<footer class="text-center py-3 mt-4">

<small>

© 2026 Gobindaganj KG & Junior School

</small>

</footer>

<script type="module" src="js/salary.js"></script>

<script>

// Auto Calculate Net Salary

function calculateSalary(){

const basic =
Number(document.getElementById("basicSalary").value||0);

const bonus =
Number(document.getElementById("bonus").value||0);

const deduction =
Number(document.getElementById("deduction").value||0);

document.getElementById("netSalary").value =
basic + bonus - deduction;

}

document.getElementById("basicSalary")
.addEventListener("input",calculateSalary);

document.getElementById("bonus")
.addEventListener("input",calculateSalary);

document.getElementById("deduction")
.addEventListener("input",calculateSalary);

</script>

</body>

</html>
