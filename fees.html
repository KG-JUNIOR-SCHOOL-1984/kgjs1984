<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fee Management</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GKJS">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#f4f7fb;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand fw-bold">

💰 Fee Management

</a>

<div>

<a href="dashboard.html" class="btn btn-light btn-sm">

🏠 Dashboard

</a>

</div>

</div>

</nav>

<div class="container py-4">

<div class="card">

<div class="card-header bg-success text-white">

<h5 class="mb-0">

Student Fee Collection

</h5>

</div>

<div class="card-body">

<form id="feeForm">

<div class="row">

<div class="col-md-4 mb-3">

<label class="form-label">

Student ID

</label>

<input
type="text"
id="studentId"
class="form-control"
placeholder="STD-000001">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Student Name

</label>

<input
type="text"
id="studentName"
class="form-control"
readonly>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Class

</label>

<input
type="text"
id="studentClass"
class="form-control"
readonly>

</div>
<div class="col-md-4 mb-3">

<label class="form-label">
Roll
</label>

<input
type="text"
id="studentRoll"
class="form-control"
readonly>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">
Month
</label>

<select
id="feeMonth"
class="form-select">

<option value="">Select Month</option>

<option>January</option>
<option>February</option>
<option>March</option>
<option>April</option>
<option>May</option>
<option>June</option>
<option>July</option>
<option>August</option>
<option>September</option>
<option>October</option>
<option>November</option>
<option>December</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">
Fee Type
</label>

<select
id="feeType"
class="form-select">

<option value="">Select Fee</option>

<option>Monthly Fee</option>
<option>Admission Fee</option>
<option>Exam Fee</option>
<option>Session Fee</option>
<option>Registration Fee</option>
<option>Transport Fee</option>
<option>Library Fee</option>
<option>Fine</option>
<option>Other</option>

</select>

</div>

<div class="col-md-4 mb-3">

<label class="form-label">
Amount
</label>

<input
type="number"
id="feeAmount"
class="form-control"
placeholder="0">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">
Payment Date
</label>

<input
type="date"
id="paymentDate"
class="form-control">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">
Payment Method
</label>

<select
id="paymentMethod"
class="form-select">

<option>Cash</option>
<option>bKash</option>
<option>Nagad</option>
<option>Rocket</option>
<option>Bank</option>

</select>

</div>
<div class="col-md-6 mb-3">

<label class="form-label">

Remarks

</label>

<textarea
id="remarks"
class="form-control"
rows="2"
placeholder="Optional Remarks"></textarea>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Payment Status

</label>

<select
id="paymentStatus"
class="form-select">

<option value="Paid">✅ Paid</option>

<option value="Pending">🟡 Pending</option>

<option value="Partial">🟠 Partial</option>

</select>

</div>

</div>

<hr>

<div class="d-flex flex-wrap gap-2 justify-content-center">

<button
type="submit"
class="btn btn-success btn-lg" id="feeSaveBtn">

💾 Save Payment

</button>

<button
type="reset"
class="btn btn-warning btn-lg">

🔄 Reset

</button>

<a
href="fees_list.html"
class="btn btn-primary btn-lg">

📋 Fee List

</a>

<a
href="dashboard.html"
class="btn btn-secondary btn-lg">

🏠 Dashboard

</a>

</div>

</form>

</div>

</div>
</div>

</div>

</div>

<footer class="text-center py-3 mt-4">

<small>

© 2026 Gobindaganj KG & Junior School

</small>

</footer>

<script type="module" src="js/fees.js"></script>

<script>

document.addEventListener("DOMContentLoaded",()=>{

    const dateInput=document.getElementById("paymentDate");

    if(dateInput){

        dateInput.value=new Date()
        .toISOString()
        .split("T")[0];

    }

});

</script>

<script src="js/pwa.js"></script>
</body>

</html>
