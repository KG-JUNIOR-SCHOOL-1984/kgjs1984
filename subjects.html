<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Subject Setup</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f7fb;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.card-header{
font-size:18px;
font-weight:bold;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-success">

<div class="container">

<a class="navbar-brand fw-bold">

📚 Subject Management

</a>

<div>

<a href="subjects_list.html"
class="btn btn-warning btn-sm">

📋 Subject List

</a>

<a href="dashboard.html"
class="btn btn-light btn-sm">

🏠 Dashboard

</a>

</div>

</div>

</nav>

<div class="container py-4">

<div class="card">

<div class="card-header bg-success text-white">

Subject Information

</div>

<div class="card-body">

<form id="subjectForm">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Subject Name

</label>

<select
id="subjectName"
class="form-select"
required>

<option value="">Select Subject</option>

<option>Bangla</option>

<option>English</option>

<option>Mathematics</option>

<option>General Knowledge</option>

<option>Religion</option>

<option>Bangladesh & Global Studies</option>

<option>Science</option>

<option>Introduction to Environment</option>

<option>Active English</option>

  <option>Discipline</option>
  
</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Subject Code

</label>

<input
type="text"
id="subjectCode"
class="form-control"
placeholder="BAN101"
required>

</div>
<div class="col-md-6 mb-3">

<label class="form-label">

Class

</label>

<select
id="subjectClass"
class="form-select"
required>

<option value="">Select Class</option>

<option>Play</option>

<option>Nursery</option>

<option>KG</option>

<option>Class 1</option>

<option>Class 2</option>

<option>Class 3</option>

<option>Class 4</option>

<option>Class 5</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Full Marks

</label>

<input
type="number"
id="fullMarks"
class="form-control"
value="100"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Pass Marks

</label>

<input
type="number"
id="passMarks"
class="form-control"
value="33"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Status

</label>

<select
id="subjectStatus"
class="form-select">

<option>Active</option>

<option>Inactive</option>

</select>

</div>
<div class="col-12 mb-3">

<label class="form-label">

Subject Description

</label>

<textarea
id="subjectDescription"
class="form-control"
rows="3"
placeholder="Write Subject Description..."></textarea>

</div>

</div>

<hr>

<div class="d-flex flex-wrap gap-2">

<button
type="submit"
class="btn btn-success">

💾 Save Subject

</button>

<button
type="reset"
class="btn btn-secondary">

🔄 Reset

</button>

<a
href="subjects_list.html"
class="btn btn-primary">

📋 Subject List

</a>

<a
href="dashboard.html"
class="btn btn-dark">

🏠 Dashboard

</a>

</div>

</form>

</div>

</div>

</div>

<footer class="text-center py-3 mt-4">

<small>

© 2026 Gobindaganj KG & Junior School

</small>

</footer>

<script type="module" src="js/subjects.js"></script>

</body>

</html>
