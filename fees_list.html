<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Fee Collection List</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f7fb;
}

.card{
border:none;
border-radius:16px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.table th{
background:#0d6efd;
color:#fff;
white-space:nowrap;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand fw-bold">

💰 Fee Collection List

</a>

<div>

<a href="fees.html"
class="btn btn-warning btn-sm">

➕ New Fee

</a>

<a href="fee_due.html"
class="btn btn-danger btn-sm">

📌 Fee Due List

</a>

<a href="dashboard.html"
class="btn btn-light btn-sm">

🏠 Dashboard

</a>

</div>

</div>

</nav>

<div class="container py-4">

<div class="card">

<div class="card-header bg-success text-white">

<h5 class="mb-0">

Fee Collection Records

</h5>

</div>

<div class="card-body">

<div class="row mb-3">

<div class="col-md-6">

<input
type="text"
id="searchFee"
class="form-control"
placeholder="Search Student ID / Name..."
onkeyup="searchFee()">

</div>

<div class="col-md-3">

<select
id="statusFilter"
class="form-select">

<option value="">All Status</option>

<option>Paid</option>

<option>Pending</option>

<option>Partial</option>

</select>

</div>

<div class="col-md-3">

<button
class="btn btn-primary w-100"
onclick="searchFee()">

🔍 Search

</button>

</div>

</div>
<div class="table-responsive">

<table class="table table-bordered table-hover align-middle text-center">

<thead>

<tr>

<th>SL</th>

<th>Student ID</th>

<th>Name</th>

<th>Class</th>

<th>Month</th>

<th>Fee Type</th>

<th>Amount (৳)</th>

<th>Payment Date</th>

<th>Status</th>

<th width="220">Action</th>

</tr>

</thead>

<tbody id="feeTableBody">

<!-- Fee Records will load here -->

</tbody>

</table>

</div>

<div class="row mt-3">

<div class="col-md-6">

<h6>

Total Records :
<span id="totalFees">0</span>

</h6>
  
<h6 class="mt-2">

Total Collection :
<span id="totalAmount">৳ 0</span>

</h6>
  
</div>

<div class="col-md-6 text-end">

<button
class="btn btn-success"
onclick="printReceipt()">

🖨 Print

</button>

</div>

</div>
</div>

</div>

</div>

<footer class="text-center py-3 mt-4">

<small>

© 2026 Gobindaganj KG & Junior School

</small>

</footer>

<script type="module" src="js/fees_list.js"></script>

</body>

</html>
