<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Attendance | School Management System V6</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#f4f7fb;
}

.card{
border:none;
border-radius:18px;
}

.card-header{
border-radius:18px 18px 0 0!important;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand fw-bold"
href="dashboard.html">

🏫 Gobindaganj KG & Junior School

</a>

<div>

<a href="attendance_list.html"
class="btn btn-light btn-sm">

📋 Attendance List

</a>

<a href="dashboard.html"
class="btn btn-warning btn-sm">

🏠 Dashboard

</a>

</div>

</div>

</nav>

<div class="container py-4">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3 class="mb-0">

📝 Student Attendance

</h3>

</div>

<div class="card-body">

<form id="attendanceForm">

<div class="row g-3">

<div class="col-md-4">

<label class="form-label">Date</label>

<input
type="date"
id="attendanceDate"
class="form-control"
required>

</div>

<div class="col-md-4">

<label class="form-label">Class</label>

<select
id="attendanceClass"
class="form-select"
required>

<option value="">Select Class</option>

<option>Play</option>
<option>Nursery</option>
<option>KG</option>
<option>Class 1</option>
<option>Class 2</option>
<option>Class 3</option>
<option>Class 4</option>
<option>Class 5</option>

</select>

</div>

<div class="col-md-4">

<label class="form-label">Section</label>

<input
type="text"
id="attendanceSection"
class="form-control"
placeholder="A">

</div>
<div class="col-md-6">

<label class="form-label">

Student

</label>

<select
id="attendanceStudent"
class="form-select"
required>

<option value="">

Select Student

</option>

</select>

</div>

<div class="col-md-6">

<label class="form-label">

Student ID

</label>

<input
type="text"
id="attendanceStudentId"
class="form-control"
readonly>

</div>

<div class="col-md-4">

<label class="form-label">

Attendance Status

</label>

<select
id="attendanceStatus"
class="form-select"
required>

<option value="Present">

✅ Present

</option>

<option value="Absent">

❌ Absent

</option>

<option value="Leave">

🟡 Leave

</option>

<option value="Late">

🟠 Late

</option>

</select>

</div>

<div class="col-md-8">

<label class="form-label">

Remarks

</label>

<input
type="text"
id="attendanceRemarks"
class="form-control"
placeholder="Optional">

</div>

</div>

<hr class="my-4">

<div class="text-center">

<button
type="submit"
class="btn btn-primary">

💾 Save Attendance

</button>

<button
type="button"
class="btn btn-secondary"
onclick="resetAttendanceForm()">

🔄 Reset

</button>

</div>

</form>
</div>

</div>

</div>

<footer class="text-center py-3 mt-4 bg-light">

<p class="mb-0">

© 2026 Gobindaganj KG & Junior School
All Rights Reserved.

</p>

</footer>

<script type="module" src="js/attendance.js"></script>

<script>

// Set Today's Date Automatically

document.addEventListener("DOMContentLoaded", () => {

const dateInput = document.getElementById("attendanceDate");

if(dateInput){

dateInput.value = new Date().toISOString().split("T")[0];

}

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
