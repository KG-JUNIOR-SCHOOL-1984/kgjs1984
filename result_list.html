<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Result List | School Management System

</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="css/style.css">

<style>

body{

background:#eef3f8;

}

.card{

border:none;

border-radius:18px;

}

.card-header{

border-radius:18px 18px 0 0!important;

}

.table th{

background:#198754;

color:#fff;

text-align:center;

}

.table td{

vertical-align:middle;

text-align:center;

}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-success shadow">

<div class="container">

<a class="navbar-brand fw-bold"
href="dashboard.html">

📊 Result List

</a>

<div>

<a href="result_entry.html"
class="btn btn-warning btn-sm">

➕ Add Result

</a>

<a href="dashboard.html"
class="btn btn-light btn-sm">

🏠 Dashboard

</a>

</div>

</div>

</nav>

<div class="container py-4">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h4 class="mb-0">

📋 Student Result List

</h4>

</div>

<div class="card-body">

<div class="row mb-3">

<div class="col-md-3 mb-2">

<input
type="text"
id="searchStudent"
class="form-control"
placeholder="Search Student">

</div>

<div class="col-md-2 mb-2">

<select
id="filterSession"
class="form-select">

<option value="">All Session</option>

<option>2026</option>

<option>2027</option>

<option>2028</option>

</select>

</div>

<div class="col-md-2 mb-2">

<select
id="filterExam"
class="form-select">

<option value="">All Exam</option>

<option>1st Term</option>

<option>2nd Term</option>

<option>3rd Term</option>

<option>Annual Exam</option>

</select>

</div>

<div class="col-md-2 mb-2">

<select
id="filterClass"
class="form-select">

<option value="">All Class</option>

<option>Play</option>

<option>Nursery</option>

<option>KG</option>

<option>Class 1</option>

<option>Class 2</option>

<option>Class 3</option>

<option>Class 4</option>

<option>Class 5</option>

</select>

</div>

<div class="col-md-3 mb-2">

<button
class="btn btn-success w-100"
onclick="searchResults()">

🔍 Search

</button>

</div>

</div>
<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>SL</th>

<th>Student ID</th>

<th>Student Name</th>

<th>Class</th>

<th>Roll</th>

<th>Session</th>

<th>Exam</th>

<th>Subject</th>

<th>Marks</th>

<th>Grade</th>

<th>GPA</th>

<th>Status</th>

<th width="220">

Action

</th>

</tr>

</thead>

<tbody id="resultTableBody">

<!-- Result Data -->

</tbody>

</table>

</div>

<div class="row mt-3">

<div class="col-md-6">

<h6>

Total Results :

<span id="totalResults">

0

</span>

</h6>

</div>

<div class="col-md-6 text-end">

<button

class="btn btn-success"

onclick="window.print()">

🖨 Print List

</button>

</div>

</div>
</div>

</div>

</div>

<footer class="text-center py-3 mt-4">

<small>

© 2026 Gobindaganj KG & Junior School

<br>

School Management System V7

</small>

</footer>

<script type="module" src="js/result_list.js"></script>

</body>

</html>
