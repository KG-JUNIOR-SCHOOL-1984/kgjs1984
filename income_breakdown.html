<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Income Breakdown | School Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
body{background:#f4f7fb;}
.card{border:none;border-radius:18px;}
.card-header{border-radius:18px 18px 0 0!important;}
.type-card{border-radius:14px;transition:.2s;}
.type-card:hover{transform:translateY(-3px);}
.type-total{font-size:1.5rem;font-weight:700;}
@media print{
  .no-print{display:none!important;}
  body{background:#fff;}
}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary no-print">
  <div class="container">
    <a class="navbar-brand fw-bold" href="dashboard.html">🏫 School Management System</a>
    <div>
      <a href="accounts.html" class="btn btn-light btn-sm">💵 Accounts</a>
      <a href="reports.html" class="btn btn-light btn-sm">📊 Reports</a>
      <a href="dashboard.html" class="btn btn-light btn-sm">🏠 Dashboard</a>
    </div>
  </div>
</nav>

<div class="container py-4">

  <div class="card shadow mb-3">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">💰 Income Breakdown</h3>
      <p class="mb-0">Fee collection split by type — Monthly, Exam, Session, Admission, Transport, etc.</p>
    </div>
    <div class="card-body no-print">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label class="form-label">From Date</label>
          <input type="date" id="fromDate" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">To Date</label>
          <input type="date" id="toDate" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">Class</label>
          <select id="classFilter" class="form-select">
            <option value="">All Classes</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Payment Status</label>
          <select id="statusFilter" class="form-select">
            <option value="Paid" selected>Paid only</option>
            <option value="">All (Paid + Pending + Partial)</option>
            <option value="Pending">Pending only</option>
            <option value="Partial">Partial only</option>
          </select>
        </div>
      </div>
      <div class="mt-3">
        <button class="btn btn-primary" id="loadBtn">🔍 Apply Filter</button>
        <button class="btn btn-outline-secondary" id="resetBtn">↺ Reset</button>
        <button class="btn btn-outline-dark" id="printBtn">🖨️ Print</button>
      </div>
    </div>
  </div>

  <div id="statusBox" class="text-center text-muted py-4">Loading income data...</div>

  <div id="reportArea" class="d-none">

    <!-- Summary cards per fee type -->
    <div class="row g-3 mb-4" id="typeCards"></div>

    <div class="card shadow mb-3">
      <div class="card-header bg-dark text-white d-flex justify-content-between">
        <span>Grand Total</span>
        <span id="grandTotal">৳ 0</span>
      </div>
    </div>

    <!-- Detailed table, grouped by type -->
    <div class="card shadow">
      <div class="card-header bg-secondary text-white">📋 Detailed Records</div>
      <div class="card-body p-0">
        <table class="table table-striped table-bordered mb-0">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>Fee Type</th>
              <th>Student</th>
              <th>Class</th>
              <th>Month</th>
              <th>Date</th>
              <th>Method</th>
              <th>Status</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody id="detailBody"></tbody>
        </table>
      </div>
    </div>

  </div>

</div>

<script type="module">
import { db, auth } from "./js/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import { fetchClasses } from "./js/classHelper.js";

const statusBox = document.getElementById("statusBox");
const reportArea = document.getElementById("reportArea");
const typeCardsEl = document.getElementById("typeCards");
const detailBody = document.getElementById("detailBody");
const grandTotalEl = document.getElementById("grandTotal");
const classFilter = document.getElementById("classFilter");
const statusFilter = document.getElementById("statusFilter");
const fromDateEl = document.getElementById("fromDate");
const toDateEl = document.getElementById("toDate");

const TYPE_COLORS = {
    "Monthly Fee": "primary",
    "Admission Fee": "success",
    "Exam Fee": "warning",
    "Session Fee": "info",
    "Registration Fee": "secondary",
    "Transport Fee": "dark",
    "Library Fee": "danger",
    "Fine": "danger",
    "Other": "secondary"
};

const TYPE_ICONS = {
    "Monthly Fee": "📅",
    "Admission Fee": "🎓",
    "Exam Fee": "📝",
    "Session Fee": "🗓️",
    "Registration Fee": "📋",
    "Transport Fee": "🚌",
    "Library Fee": "📚",
    "Fine": "⚠️",
    "Other": "💠"
};

let allFees = [];

async function populateClassOptions() {
    try {
        const classes = await fetchClasses();
        classes.forEach((cls) => {
            const opt = document.createElement("option");
            opt.value = cls.name;
            opt.textContent = cls.name;
            classFilter.appendChild(opt);
        });
    } catch (error) {
        console.error("populateClassOptions error:", error);
    }
}

async function loadFees() {
    const snap = await getDocs(collection(db, "fees"));
    allFees = snap.docs.map((d) => ({ docId: d.id, ...d.data() }));
}

function applyFilters() {
    const from = fromDateEl.value;
    const to = toDateEl.value;
    const cls = classFilter.value;
    const status = statusFilter.value;

    return allFees.filter((fee) => {
        const feeDate = fee.paymentDate || "";

        if (from && feeDate && feeDate < from) return false;
        if (to && feeDate && feeDate > to) return false;
        if (cls && fee.studentClass !== cls) return false;
        if (status && fee.paymentStatus !== status) return false;

        return true;
    });
}

function render() {
    const filtered = applyFilters();

    // Group by feeType
    const groups = {};
    let grandTotal = 0;

    filtered.forEach((fee) => {
        const type = fee.feeType || "Other";
        const amount = Number(fee.amount || 0);

        if (!groups[type]) groups[type] = { total: 0, count: 0 };
        groups[type].total += amount;
        groups[type].count += 1;
        grandTotal += amount;
    });

    // Render summary cards, sorted by total descending
    typeCardsEl.innerHTML = "";

    const sortedTypes = Object.keys(groups).sort((a, b) => groups[b].total - groups[a].total);

    if (sortedTypes.length === 0) {
        typeCardsEl.innerHTML = `<div class="col-12"><div class="alert alert-info">No records match this filter.</div></div>`;
    }

    sortedTypes.forEach((type) => {
        const g = groups[type];
        const color = TYPE_COLORS[type] || "secondary";
        const icon = TYPE_ICONS[type] || "💠";

        const col = document.createElement("div");
        col.className = "col-md-4 col-sm-6";
        col.innerHTML = `
            <div class="card type-card shadow-sm border-${color}">
                <div class="card-body text-center">
                    <div style="font-size:1.8rem;">${icon}</div>
                    <div class="text-muted">${type}</div>
                    <div class="type-total text-${color}">৳ ${g.total.toLocaleString()}</div>
                    <div class="text-muted small">${g.count} record(s)</div>
                </div>
            </div>
        `;
        typeCardsEl.appendChild(col);
    });

    grandTotalEl.textContent = "৳ " + grandTotal.toLocaleString();

    // Detailed table, sorted by type then date
    const sortedRows = [...filtered].sort((a, b) =>
        (a.feeType || "").localeCompare(b.feeType || "") ||
        (a.paymentDate || "").localeCompare(b.paymentDate || "")
    );

    detailBody.innerHTML = "";

    if (sortedRows.length === 0) {
        detailBody.innerHTML = `<tr><td colspan="9" class="text-center text-muted py-3">No records found.</td></tr>`;
    }

    sortedRows.forEach((fee, idx) => {
        const badge = TYPE_COLORS[fee.feeType] || "secondary";
        detailBody.innerHTML += `
            <tr>
                <td>${idx + 1}</td>
                <td><span class="badge bg-${badge}">${fee.feeType || ""}</span></td>
                <td>${fee.name || ""}</td>
                <td>${fee.studentClass || ""}</td>
                <td>${fee.feeMonth || ""}</td>
                <td>${fee.paymentDate || ""}</td>
                <td>${fee.paymentMethod || ""}</td>
                <td>${fee.paymentStatus || ""}</td>
                <td>৳ ${Number(fee.amount || 0).toLocaleString()}</td>
            </tr>
        `;
    });

    statusBox.classList.add("d-none");
    reportArea.classList.remove("d-none");
}

document.getElementById("loadBtn").addEventListener("click", render);

document.getElementById("resetBtn").addEventListener("click", () => {
    fromDateEl.value = "";
    toDateEl.value = "";
    classFilter.value = "";
    statusFilter.value = "Paid";
    render();
});

document.getElementById("printBtn").addEventListener("click", () => window.print());

onAuthStateChanged(auth, async (user) => {
    if (!user) {
        statusBox.innerHTML = `⚠️ Please <a href="login.html">log in</a> first, then open this page again.`;
        return;
    }

    try {
        await populateClassOptions();
        await loadFees();
        render();
    } catch (error) {
        console.error(error);
        statusBox.innerHTML = `<span class="text-danger">Failed to load income data: ${error.message}</span>`;
    }
});
</script>

</body>
</html>
