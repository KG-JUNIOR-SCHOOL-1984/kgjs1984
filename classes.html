<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Management | School Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
<div class="container">
<a class="navbar-brand fw-bold" href="dashboard.html">🏫 School Management System</a>
<div>
<a href="dashboard.html" class="btn btn-light btn-sm">⬅ Dashboard</a>
<a href="classes_list.html" class="btn btn-outline-light btn-sm ms-2">📋 Class List</a>
</div>
</div>
</nav>

<div class="container py-4">

<h3 class="mb-4">🏷️ Class Management</h3>

<div class="card shadow">
<div class="card-header bg-primary text-white">Add / Edit Class</div>
<div class="card-body">

<form id="classForm">

<div class="row g-3">

<div class="col-md-6">
<label class="form-label">Class Name</label>
<input type="text" id="className" class="form-control" placeholder="e.g. Class 5" required>
</div>

<div class="col-md-6">
<label class="form-label">Display Order</label>
<input type="number" id="classOrder" class="form-control" placeholder="e.g. 1, 2, 3 ...">
</div>

<div class="col-md-8">
<label class="form-label">Sections (comma separated)</label>
<input type="text" id="classSections" class="form-control" placeholder="e.g. A, B, C">
</div>

<div class="col-md-4">
<label class="form-label">Class Teacher</label>
<select id="classTeacher" class="form-select">
<option value="">-- No Class Teacher --</option>
</select>
</div>

</div>

<div class="mt-4 d-flex gap-2">
<button type="submit" id="classSubmitBtn" class="btn btn-primary">Save Class</button>
<button type="button" class="btn btn-secondary" onclick="resetClassForm()">Reset</button>
</div>

</form>

</div>
</div>

</div>

<footer class="bg-primary text-white text-center py-3 mt-4">
© School Management System 2026
</footer>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/classes.js"></script>

</body>
</html>
