<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Management | Gobindaganj KG & Junior School</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#eef3f8;
}

.card{
border:none;
border-radius:18px;
}

.card-header{
border-radius:18px 18px 0 0!important;
}

.required{
color:red;
}

.photo-box{
width:170px;
height:170px;
margin:auto;
border-radius:50%;
overflow:hidden;
border:4px solid #0d6efd;
background:#fff;
}

.photo-box img{
width:100%;
height:100%;
object-fit:cover;
}

.section-title{
font-size:18px;
font-weight:bold;
color:#0d6efd;
border-bottom:2px solid #0d6efd;
padding-bottom:6px;
margin:25px 0 15px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand fw-bold"
href="dashboard.html">

🏫 Gobindaganj KG & Junior School

</a>

<div>

<a href="teachers_list.html"
class="btn btn-warning btn-sm">

📋 Teacher List

</a>

<a href="dashboard.html"
class="btn btn-light btn-sm">

🏠 Dashboard

</a>

<button type="button" class="btn btn-danger btn-sm ms-2" onclick="logout()">

🔒 Logout

</button>

</div>

</div>

</nav>

<div class="container py-4">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>👨‍🏫 Teacher Management</h3>

<p class="mb-0">
Add / Edit Teacher Information
</p>

</div>

<div class="card-body">

<form id="teacherForm">

<div class="section-title">

Basic Information

</div>
<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Teacher ID <span class="required">*</span>

</label>

<input
type="text"
id="teacherId"
class="form-control"
readonly>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Teacher Name <span class="required">*</span>

</label>

<input
type="text"
id="teacherName"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Father's Name

</label>

<input
type="text"
id="fatherName"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Mother's Name

</label>

<input
type="text"
id="motherName"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Designation

</label>

<select
id="designation"
class="form-select">

<option value="">Select Designation</option>

<option>Principal</option>
<option>Vice Principal</option>
<option>Senior Teacher</option>
<option>Assistant Teacher</option>
<option>Office Staff</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Subject

</label>

<select
id="teacherSubject"
class="form-select">

<option value="">Select Subject</option>

<option>Bangla</option>
<option>English</option>
<option>Mathematics</option>
<option>Science</option>
<option>Religion</option>
<option>ICT</option>
<option>General</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Joining Date

</label>

<input
type="date"
id="joiningDate"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Date of Birth

</label>

<input
type="date"
id="teacherDOB"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Gender

</label>

<select
id="teacherGender"
class="form-select">

<option value="">Select Gender</option>

<option>Male</option>
<option>Female</option>
<option>Other</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Religion

</label>

<select
id="teacherReligion"
class="form-select">

<option value="">Select Religion</option>

<option>Islam</option>
<option>Hinduism</option>
<option>Christianity</option>
<option>Buddhism</option>
<option>Others</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Mobile Number

</label>

<input
type="text"
id="teacherMobile"
class="form-control"
placeholder="01XXXXXXXXX">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Email

</label>

<input
type="email"
id="teacherEmail"
class="form-control"
placeholder="teacher@gmail.com">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Monthly Salary (৳)

</label>

<input
type="number"
id="teacherSalary"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Status

</label>

<select
id="teacherStatus"
class="form-select">

<option value="Active">🟢 Active</option>
<option value="Inactive">🔴 Inactive</option>
<option value="Retired">🟡 Retired</option>

</select>

</div>

<div class="col-12 mb-3">

<label class="form-label">

Address

</label>

<textarea
id="teacherAddress"
class="form-control"
rows="3"></textarea>

</div>

<div class="col-12">

<div class="section-title">

Teacher Photo

</div>

</div>

<div class="col-12 text-center">

<div class="photo-box">

<img
id="teacherPhotoPreview"
src="https://via.placeholder.com/170"
alt="Teacher Photo">

</div>

<input
type="file"
id="teacherPhoto"
class="form-control mt-3"
accept="image/*"
onchange="previewTeacherPhoto(event)">

    </div>
    <div class="col-12">

<hr>

<div class="d-flex flex-wrap justify-content-center gap-2">

<button
type="submit"
class="btn btn-primary btn-lg">

💾 Save Teacher

</button>

<button
type="button"
class="btn btn-warning btn-lg"
onclick="resetTeacherForm()">

🔄 Reset

</button>

<a
href="teachers_list.html"
class="btn btn-success btn-lg">

📋 Teacher List

</a>

<a
href="dashboard.html"
class="btn btn-secondary btn-lg">

🏠 Dashboard

</a>

</div>

</div>

</div>

</form>

</div>

</div>

</div>

<footer class="text-center py-3">

<small>

© 2026 Gobindaganj KG & Junior School

</small>

</footer>

<script type="module" src="js/auth.js"></script>
<script type="module" src="js/teachers.js"></script>

</body>

</html>
