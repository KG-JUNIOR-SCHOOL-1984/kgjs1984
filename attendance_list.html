<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Attendance Records List</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f7fb;
}

.card{
border:none;
border-radius:16px;
box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.table th{
background:#0d6efd;
color:#fff;
white-space:nowrap;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand fw-bold">

📋 Attendance Records List

</a>

<div>

<a href="attendance.html"
class="btn btn-warning btn-sm">

➕ Mark Attendance

</a>

<a href="dashboard.html"
class="btn btn-light btn-sm">

🏠 Dashboard

</a>

</div>

</div>

</nav>

<div class="container py-4">

<div class="card">

<div class="card-header bg-success text-white">

<h5 class="mb-0">

Attendance Records

</h5>

</div>

<div class="card-body">

<div class="row mb-3">

<div class="col-md-5">

<input
type="text"
id="searchAttendance"
class="form-control"
placeholder="Search Student ID / Name / Class..."
onkeyup="searchAttendance()">

</div>

<div class="col-md-3">

<select
id="statusFilter"
class="form-select"
onchange="searchAttendance()">

<option value="">All Status</option>

<option>Present</option>

<option>Absent</option>

<option>Leave</option>

<option>Late</option>

</select>

</div>

<div class="col-md-3">

<button
class="btn btn-primary w-100"
onclick="searchAttendance()">

🔍 Search

</button>

</div>

</div>

<div class="table-responsive">

<table class="table table-bordered table-hover align-middle text-center">

<thead>

<tr>

<th>SL</th>

<th>Date</th>

<th>Student ID</th>

<th>Name</th>

<th>Class</th>

<th>Section</th>

<th>Status</th>

<th>Remarks</th>

<th width="160">Action</th>

</tr>

</thead>

<tbody id="attendanceTableBody">

<!-- Attendance Records will load here -->

</tbody>

</table>

</div>

<h6>

Total Records :
<span id="totalAttendance">0</span>

</h6>

</div>

</div>

</div>

<footer class="text-center py-3 mt-4">

<small>

© 2026 Gobindaganj KG & Junior School

</small>

</footer>

<script type="module" src="js/attendance_list.js"></script>

</body>

</html>
