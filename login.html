<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Gobindaganj KG & Junior School</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
background:#0d6efd;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding: 20px 0;
}

.login-card{
width:440px;
background:#fff;
padding:35px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.logo{
width:90px;
height:90px;
display:block;
margin:auto;
}

h3{
text-align:center;
margin-top:15px;
margin-bottom:20px;
font-size:1.4rem;
font-weight:bold;
}

.demo-box {
background: #f8f9fa;
border: 1px dashed #6c757d;
border-radius: 10px;
padding: 12px;
margin-top: 15px;
}

</style>

</head>

<body>

<div class="login-card">

<img
src="images/logo.png"
class="logo"
alt="School Logo">

<h3>School Management System</h3>

<div class="text-center mb-2">
<a href="index.html" class="text-decoration-none small">&larr; Back to Home</a>
</div>

<form id="loginForm" onsubmit="event.preventDefault(); login();">

<div class="mb-3">
<label class="form-label font-weight-bold">Email Address</label>
<input
type="email"
id="email"
class="form-control"
placeholder="e.g. admin@school.com"
required>
</div>

<div class="mb-3">
<label class="form-label font-weight-bold">Password</label>
<div class="input-group">
<input
type="password"
id="password"
class="form-control"
placeholder="Enter Password"
required>
<button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('password', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
<i class="bi bi-eye"></i>
</button>
</div>
</div>

<div class="form-check mb-3">
<input
class="form-check-input"
type="checkbox"
id="rememberMe">
<label
class="form-check-label"
for="rememberMe">
Remember Me
</label>
</div>

<div class="d-grid gap-2">
<button
type="submit"
class="btn btn-primary btn-lg">
🔐 Login
</button>

<div class="d-flex justify-content-between">
<button
type="button"
class="btn btn-outline-secondary btn-sm"
data-bs-toggle="modal"
data-bs-target="#registerModal">
📝 Create Account
</button>

<button
type="button"
class="btn btn-link text-decoration-none btn-sm"
onclick="resetPassword()">
Forgot Password?
</button>
</div>
</div>

<hr>

<div class="text-center">
<p class="mb-1 text-muted small">
© 2026 School Management System V6
</p>
<a
href="https://firebase.google.com/"
target="_blank"
class="small text-secondary">
Powered by Firebase Auth & Firestore
</a>
</div>

</form>

</div>

<!-- Register Modal -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="registerModalLabel">📝 Register New Account</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="regForm" onsubmit="event.preventDefault(); registerUser();">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" id="regName" class="form-control" placeholder="Enter Full Name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" id="regEmail" class="form-control" placeholder="Enter Email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password (min 6 characters)</label>
            <div class="input-group">
              <input type="password" id="regPassword" class="form-control" placeholder="Create Password" minlength="6" required>
              <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('regPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select id="regRole" class="form-select">
              <option value="admin">Admin</option>
              <option value="teacher">Teacher</option>
              <option value="student">Student</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary w-100">Create Account & Login</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/auth.js"></script>

</body>
</html>
