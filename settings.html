<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings | School Management System V7</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="css/style.css">

<style>

body{
    background:#eef3f8;
}

.card{
    border:none;
    border-radius:18px;
}

.card-header{
    border-radius:18px 18px 0 0!important;
}

.section-title{
    font-size:18px;
    font-weight:bold;
    color:#0d6efd;
    border-bottom:2px solid #0d6efd;
    padding-bottom:8px;
    margin:25px 0 20px;
}

.logo-preview{
    width:150px;
    height:150px;
    margin:auto;
    border-radius:15px;
    border:3px solid #0d6efd;
    overflow:hidden;
    background:#fff;
}

.logo-preview img{
    width:100%;
    height:100%;
    object-fit:contain;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

<div class="container">

<a class="navbar-brand fw-bold"
href="dashboard.html">

⚙️ System Settings

</a>

<div>

<a href="dashboard.html"
class="btn btn-light btn-sm">

🏠 Dashboard

</a>

<button type="button" class="btn btn-danger btn-sm ms-2" onclick="logout()">

🔒 Logout

</button>

</div>

</div>

</nav>

<div class="container py-4">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3 class="mb-1">

⚙️ School Settings

</h3>

<p class="mb-0">

Manage School Information & System Configuration

</p>

</div>

<div class="card-body">

<form id="settingsForm">

<div class="section-title">

🏫 School Information

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

School Name

</label>

<input
type="text"
id="schoolName"
class="form-control"
placeholder="Enter School Name"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

EIIN Number

</label>

<input
type="text"
id="eiin"
class="form-control"
placeholder="Enter EIIN Number">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Principal Name

</label>

<input
type="text"
id="principalName"
class="form-control"
placeholder="Principal Name">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Current Session

</label>

<select
id="currentSession"
class="form-select">

<option>2026</option>
<option>2027</option>
<option>2028</option>
<option>2029</option>
<option>2030</option>

</select>

</div>
  <div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

School Address

</label>

<textarea
id="schoolAddress"
class="form-control"
rows="3"
placeholder="Enter School Address">

</textarea>

</div>

<div class="col-md-6">

<div class="row">

<div class="col-12 mb-3">

<label class="form-label">

Mobile Number

</label>

<input
type="text"
id="schoolMobile"
class="form-control"
placeholder="01XXXXXXXXX">

</div>

<div class="col-12 mb-3">

<label class="form-label">

Email Address

</label>

<input
type="email"
id="schoolEmail"
class="form-control"
placeholder="school@email.com">

</div>

<div class="col-12 mb-3">

<label class="form-label">

Website

</label>

<input
type="text"
id="schoolWebsite"
class="form-control"
placeholder="www.school.com">

</div>

</div>

</div>

</div>

<div class="section-title">

🖼 School Logo

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Upload Logo

</label>

<input
type="file"
id="schoolLogo"
class="form-control"
accept="image/*"
onchange="previewSchoolLogo(event)">

</div>

<div class="col-md-6 text-center">

<div class="logo-preview">

<img
id="logoPreview"
src="images/logo.png"
alt="School Logo">

</div>

</div>

</div>
  <div class="section-title">

👤 Admin Information

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Admin Name

</label>

<input
type="text"
id="adminName"
class="form-control"
placeholder="Admin Name">

</div>


<div class="col-md-6 mb-3">

<label class="form-label">

Admin Email

</label>

<input
type="email"
id="adminEmail"
class="form-control"
placeholder="Admin Email">

</div>


<div class="col-md-6 mb-3">

<label class="form-label">

Username

</label>

<input
type="text"
id="adminUsername"
class="form-control"
placeholder="Admin Username">

</div>


<div class="col-md-6 mb-3">

<label class="form-label">

Password

</label>

<div class="input-group">
<input
type="password"
id="adminPassword"
class="form-control"
placeholder="Change Password">
<button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('adminPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
<i class="bi bi-eye"></i>
</button>
</div>

</div>

</div>


<hr>


<div class="text-center mt-4">

<button
type="submit"
class="btn btn-primary btn-lg">

💾 Save Settings

</button>


<button
type="reset"
class="btn btn-warning btn-lg">

🔄 Reset

</button>


<a
href="dashboard.html"
class="btn btn-secondary btn-lg">

🏠 Dashboard

</a>

</div>


</form>

</div>

</div>

</div>


<footer class="text-center py-3 mt-4">

<small>

© 2026 Gobindaganj KG & Junior School

<br>

School Management System V7

</small>

</footer>


<script type="module" src="js/auth.js"></script>
<script type="module" src="js/settings.js"></script>


</body>

</html>
